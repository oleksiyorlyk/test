name: testforge
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      CONTROL_DATA_DIR: /app/backend/data/control
    init: true
    shm_size: 1gb
    volumes:
      - type: bind
        source: ./backend/data
        target: /app/backend/data
      - type: bind
        source: ./runner/generated-tests
        target: /app/runner/generated-tests
      - type: bind
        source: ./runner/test-results
        target: /app/runner/test-results
      - type: bind
        source: ./runner/playwright-report
        target: /app/runner/playwright-report
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    profiles: ["public"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
