[project]
name = "ai-test-automation-generator"
version = "1.0.0"
description = "Local Azure User Story review and Playwright automation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "requests==2.34.2",
  "python-dotenv==1.2.4",
  "beautifulsoup4==4.15.0",
  "openai==2.54.0",
  "pydantic==2.14.3",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "psutil==7.2.2",
]

[dependency-groups]
dev = ["httpx==0.28.1", "ruff>=0.14,<0.16"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backend/data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

